<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>☁ Weather Dashboard</h1>
            <p>Discover the weather around you</p>
        </header>

        <form id="weatherForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >
            <button type="submit" id="searchBtn">Search</button>
        </form>

        <p id="status"></p>

        <section id="currentWeather" class="weather-card hidden">
            <h2 id="cityName"></h2>

            <div class="current-info">
                <span id="weatherIcon"></span>

                <div>
                    <h1 id="temperature"></h1>
                    <p id="weatherDescription"></p>
                </div>
            </div>

            <p id="date"></p>
        </section>

        <section id="forecastSection" class="hidden">
            <h2>5-Day Forecast</h2>
            <div id="forecast" class="forecast-container"></div>
        </section>

        <footer>
            <p>Weather data powered by Open-Meteo</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
